name: CI Pipeline

on:
  push:
    branches:
      - development  # Trigger on pushes to the development branch
  schedule:
    - cron: '0 * * * *'  # Runs every 1 hour in UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  delete-stale-branches:
    name: Delete Stale Branches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Delete branches inactive for more than 60 days
        uses: crs-k/stale-branches@v6.0.2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 59
          days-before-delete: 60
          dry-run: false
          branches-filter-regex: '^(?!main$|production$|development$).*'
          comment-updates: false
